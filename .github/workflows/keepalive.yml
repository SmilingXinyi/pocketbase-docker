name: Keepalive

on:
  schedule:
    # Twice a month. Public repos disable scheduled workflows after 60 days
    # without repository activity (pushes/PRs/issues), so this must commit.
    - cron: "0 0 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write  # push the heartbeat commit

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update heartbeat and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p .github
          echo "last_heartbeat=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/.keepalive

          # Stage first: an untracked file does not show up in `git diff`.
          git add .github/.keepalive
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(keepalive): heartbeat [skip ci]"
          git push
